# Petit cache des réponses API (5 min) : soulage l'API EFS si plusieurs personnes consultent la page.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:2m max_size=20m inactive=30m use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://geo.api.gouv.fr https://oudonner.api.efs.sante.fr; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://geo.api.gouv.fr https://oudonner.api.efs.sante.fr; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    }

    # Proxy vers l'API Carto v3 de l'EFS (évite le blocage CORS du navigateur)
    location /api/efs/ {
        limit_except GET { deny all; }
        proxy_pass https://oudonner.api.efs.sante.fr/carto-api/v3/;
        proxy_ssl_server_name on;
        proxy_set_header Host oudonner.api.efs.sante.fr;
        proxy_set_header Accept "application/json";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_cache api;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
    }

    # Proxy vers l'API Géo de l'État (code postal -> communes)
    location /api/geo/ {
        limit_except GET { deny all; }
        proxy_pass https://geo.api.gouv.fr/;
        proxy_ssl_server_name on;
        proxy_set_header Host geo.api.gouv.fr;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        proxy_cache api;
        proxy_cache_valid 200 1d;
    }
}
